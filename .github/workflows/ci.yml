name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify public source export
        run: ./scripts/export-public-source.sh "$RUNNER_TEMP/DuoLauncher-public"
      - name: Build, test, and lint
        working-directory: ${{ runner.temp }}/DuoLauncher-public
        run: ./gradlew --no-daemon -PduoProjectionTestsOnly=true :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleRelease
